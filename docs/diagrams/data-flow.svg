<text x="665.0" y="194.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">ingest_daily: extract → validate</text>
<text x="665.0" y="212.25" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">→ transform → load</text>
<text x="665.0" y="229.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">posts_clean: mark → label_ad, cut</text>
