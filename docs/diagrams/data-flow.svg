<text x="665.0" y="514.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">MLflow dzhynsa-tfidf @champion</text>
<text x="665.0" y="532.25" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">tags data_version + git_commit</text>
<text x="665.0" y="549.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">make reproduce; Minikube (Lab 4)</text>
<rect x="970" y="420" width="460" height="190" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="1200.0" y="484.0" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">6 Inference</text>
<text x="1200.0" y="506.0" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">batch: nightly scoring of all new posts</text>
<text x="1200.0" y="523.5" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">online: scorer /score /search /stats</text>
<text x="1200.0" y="541.0" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">LLM: Qwen3-4B + 8 posts found by BM25</text>
<text x="1200.0" y="558.5" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">fallback: TF-IDF</text>
