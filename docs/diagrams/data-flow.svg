<text x="195.0" y="172.75" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">1 Data ingestion</text>
<text x="195.0" y="194.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">Telethon collector (make collect)</text>
<text x="195.0" y="212.25" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">data/raw/&lt;channel&gt;/&lt;day&gt;.jsonl.gz</text>
