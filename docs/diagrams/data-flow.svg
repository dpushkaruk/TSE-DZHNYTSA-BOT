<text x="965.0" y="752.75" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">7 Monitoring and retraining</text>
<text x="965.0" y="774.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">monitor_weekly: DAG + freshness, quality gate with marked-ad count per channel,</text>
<text x="965.0" y="792.25" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">recall on the week's marked ads, precision@20 from review_weekly,</text>
<text x="965.0" y="809.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">prediction drift (Evidently), Prometheus + Grafana → Telegram alerts</text>
