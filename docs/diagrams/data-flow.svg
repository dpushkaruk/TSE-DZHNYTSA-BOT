<text x="195.0" y="506.0" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">train.py (make train)</text>
<text x="195.0" y="523.5" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">rule vs TF-IDF + LR (Lab 2)</text>
<text x="195.0" y="541.0" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">XLM-R on Kaggle, LLM (Lab 3)</text>
<text x="195.0" y="558.5" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">Jun–Aug / Sep / Oct → MLflow</text>
