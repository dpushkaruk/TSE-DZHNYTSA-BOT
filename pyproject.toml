[project]
name = "tse-dzhynsa-bot"
version = "0.1.0"
description = "Detects hidden paid posts (dzhynsa) in public Ukrainian Telegram channels (KSE MLOps course project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon==1.40.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.1.1",
    "pandas>=3.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "psycopg2-binary==2.9.11",
    "mlflow==3.16.1",
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
